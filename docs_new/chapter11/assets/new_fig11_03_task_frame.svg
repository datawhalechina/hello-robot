<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">arm_base_link 坐标系与抓取任务点（单位：m）</text>

  <!-- 左：侧视图 x-y -->
  <rect x="30" y="55" width="560" height="520" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="310" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">侧视图（x 向前，y 向下）</text>
  <line x1="70" y1="110" x2="200" y2="110" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="70" y1="110" x2="70" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="205" y="115" font-size="14" fill="#334155">x（前）</text>
  <text x="78" y="245" font-size="14" fill="#334155">y（下）</text>

  <rect x="100" y="374" width="420" height="56" fill="#e7d3bd" stroke="#92400e"/>
  <text x="430" y="408" font-size="13" fill="#78350f">桌面 table_top，上表面 y≈0.57</text>
  <rect x="256" y="323" width="52" height="52" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="318" y="354" font-size="13" fill="#b91c1c">红色物体中心 (0.56, 0.535)</text>

  <circle cx="282" cy="216" r="7" fill="#2563eb"/>
  <text x="300" y="220" font-size="13" fill="#1d4ed8">预抓取 y=0.345（+[0,-0.19,0]）</text>
  <circle cx="282" cy="304" r="7" fill="#16a34a"/>
  <text x="318" y="300" font-size="13" fill="#15803d">抓取 y=0.47（+[0,-0.065,0]）</text>
  <circle cx="268" cy="160" r="7" fill="#ea580c"/>
  <text x="286" y="164" font-size="13" fill="#c2410c">抬升 (0.54, 0.265)（+[-0.02,-0.27,0]）</text>
  <path d="M282 225 V294" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M278 294 L270 172" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="60" y="470" font-size="13" fill="#334155">y 轴向下：减小 y = 向上抬起</text>
  <text x="60" y="494" font-size="13" fill="#334155">预抓取 → 抓取：y 增大（向下接近）</text>
  <text x="60" y="518" font-size="13" fill="#334155">抓取 → 抬升：y 减小（向上），x 略减小（略向后）</text>
  <text x="60" y="552" font-size="12" fill="#64748b">示意图：任务点与物体按同一比例绘制，左上角坐标轴只表示方向；z 方向见右图</text>

  <!-- 右：俯视图 -->
  <rect x="610" y="55" width="560" height="520" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="890" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">俯视图（上方 = 机器人前方 x，左方 = z）</text>
  <rect x="811" y="161" width="345" height="285" fill="#f5ebe0" stroke="#92400e"/>
  <text x="820" y="180" font-size="12" fill="#78350f">桌面投影</text>
  <rect x="1065" y="318" width="48" height="51" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
  <text x="1089" y="392" text-anchor="middle" font-size="12" fill="#a16207">黄色阻挡物</text>
  <text x="1089" y="408" text-anchor="middle" font-size="11" fill="#a16207">z=-0.63，高 0.37</text>
  <rect x="1018" y="341" width="22" height="22" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="1029" y="333" text-anchor="middle" font-size="12" fill="#b91c1c">红 z=-0.43</text>
  <rect x="943" y="341" width="22" height="22" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="954" y="333" text-anchor="middle" font-size="12" fill="#15803d">绿 z=-0.18</text>
  <rect x="877" y="323" width="22" height="22" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <text x="866" y="316" text-anchor="middle" font-size="12" fill="#1d4ed8">蓝 z=0.04</text>
  <circle cx="900" cy="520" r="10" fill="#475569"/>
  <text x="918" y="525" font-size="13" fill="#334155">arm_base_link 原点</text>
  <line x1="900" y1="520" x2="900" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="900" y1="520" x2="850" y2="520" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="906" y="482" font-size="13" fill="#334155">x</text>
  <text x="830" y="512" font-size="13" fill="#334155">z</text>
  <text x="640" y="548" font-size="13" fill="#334155">右臂工作区 z ＜ 0（图中原点右侧）</text>
</svg>
