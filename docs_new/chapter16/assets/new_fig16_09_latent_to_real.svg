<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">潜在动作如何“换接”到 G2 的 16 维真实动作</text>

  <!-- Stage 2 column -->
  <rect x="30" y="56" width="440" height="370" rx="12" fill="#f6f8fc" stroke="#b8c6de"/>
  <text x="250" y="84" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4f8a">Stage 2：training_mode = pretrain</text>
  <rect x="70" y="104" width="360" height="50" rx="6" fill="#fff3d6" stroke="#d1a032"/>
  <text x="250" y="126" text-anchor="middle" font-size="14" fill="#333">监督：latent_action_dim14（14 维潜在动作）</text>
  <text x="250" y="145" text-anchor="middle" font-size="12" fill="#777">没有 initial_state</text>
  <rect x="70" y="176" width="360" height="50" rx="6" fill="#dbe8f8" stroke="#4a7fc1"/>
  <text x="250" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4f8a">input_encoder = ActionEncoder</text>
  <text x="250" y="217" text-anchor="middle" font-size="12" fill="#333">只编码带噪动作序列</text>
  <rect x="70" y="248" width="360" height="60" rx="6" fill="#e3e3e3" stroke="#888"/>
  <text x="250" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">30 层动作专家 + 联合注意力 QKV</text>
  <text x="250" y="294" text-anchor="middle" font-size="12" fill="#333">学到“视觉变化 ↔ 运动”的通用结构</text>
  <rect x="70" y="330" width="360" height="50" rx="6" fill="#dbe8f8" stroke="#4a7fc1"/>
  <text x="250" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4f8a">decoder → 14 维速度场</text>
  <text x="250" y="371" text-anchor="middle" font-size="12" fill="#333">潜在空间里的输出头</text>
  <line x1="250" y1="154" x2="250" y2="174" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
  <line x1="250" y1="226" x2="250" y2="246" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
  <line x1="250" y1="308" x2="250" y2="328" stroke="#555" stroke-width="2" marker-end="url(#b)"/>

  <!-- Stage 3 column -->
  <rect x="530" y="56" width="440" height="370" rx="12" fill="#fdf7ef" stroke="#e0b98a"/>
  <text x="750" y="84" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a4f10">Stage 3（本章）：training_mode = finetune</text>
  <rect x="570" y="104" width="360" height="50" rx="6" fill="#fff3d6" stroke="#d1a032"/>
  <text x="750" y="126" text-anchor="middle" font-size="14" fill="#333">监督：commands（16 维绝对关节目标）</text>
  <text x="750" y="145" text-anchor="middle" font-size="12" fill="#777">条件：qpos（16 维实测状态）</text>
  <rect x="570" y="176" width="360" height="50" rx="6" fill="#fde3c6" stroke="#d98a2b"/>
  <text x="750" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4f10">input_encoder = StateActionEncoder</text>
  <text x="750" y="217" text-anchor="middle" font-size="12" fill="#333">新建，完整训练（不加载 Stage 2 权重）</text>
  <rect x="570" y="248" width="360" height="60" rx="6" fill="#e3e3e3" stroke="#888"/>
  <text x="750" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">同一套 30 层主体：冻结 + LoRA 增量</text>
  <text x="750" y="294" text-anchor="middle" font-size="12" fill="#333">QKV 键名经 remap 后装入</text>
  <rect x="570" y="330" width="360" height="50" rx="6" fill="#fde3c6" stroke="#d98a2b"/>
  <text x="750" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4f10">decoder → 16 维速度场</text>
  <text x="750" y="371" text-anchor="middle" font-size="12" fill="#333">新建，完整训练</text>
  <line x1="750" y1="154" x2="750" y2="174" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
  <line x1="750" y1="226" x2="750" y2="246" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
  <line x1="750" y1="308" x2="750" y2="328" stroke="#555" stroke-width="2" marker-end="url(#b)"/>

  <!-- transfer arrows -->
  <line x1="430" y1="278" x2="568" y2="278" stroke="#4f9a57" stroke-width="3" marker-end="url(#b)"/>
  <text x="500" y="268" text-anchor="middle" font-size="13" fill="#2d6b33">继承</text>
  <line x1="430" y1="201" x2="568" y2="201" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="500" y="193" text-anchor="middle" font-size="13" fill="#c0392b">丢弃</text>
  <line x1="430" y1="355" x2="568" y2="355" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="500" y="347" text-anchor="middle" font-size="13" fill="#c0392b">丢弃</text>

  <text x="500" y="460" text-anchor="middle" font-size="14" fill="#444">“接口两端换新、中间主体继承”：潜在动作不会在部署时被逐项翻译成关节角，</text>
  <text x="500" y="482" text-anchor="middle" font-size="14" fill="#444">它的作用是在预训练中塑造主体；G2 的真实动作接口由 Stage 3 重新学习。</text>
</svg>
