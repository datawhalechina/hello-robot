<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">本章 Stage 3 中哪些参数被更新</text>

  <!-- left: LoRALinear -->
  <rect x="30" y="56" width="450" height="250" rx="12" fill="#f6f8fc" stroke="#b8c6de"/>
  <text x="255" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4f8a">LoRALinear（普通线性层）</text>
  <rect x="60" y="150" width="60" height="40" rx="6" fill="#e8f1fb" stroke="#4a7fc1"/>
  <text x="90" y="175" text-anchor="middle" font-size="15" fill="#333">x</text>
  <rect x="180" y="104" width="150" height="44" rx="6" fill="#e3e3e3" stroke="#888"/>
  <text x="255" y="131" text-anchor="middle" font-size="14" fill="#333">W（冻结）</text>
  <rect x="160" y="196" width="80" height="44" rx="6" fill="#fde3c6" stroke="#d98a2b"/>
  <text x="200" y="223" text-anchor="middle" font-size="14" fill="#333">A: r×in</text>
  <rect x="270" y="196" width="80" height="44" rx="6" fill="#fde3c6" stroke="#d98a2b"/>
  <text x="310" y="223" text-anchor="middle" font-size="14" fill="#333">B: out×r</text>
  <circle cx="420" cy="170" r="20" fill="#fff" stroke="#555"/>
  <text x="420" y="176" text-anchor="middle" font-size="18" fill="#333">+</text>
  <line x1="120" y1="165" x2="178" y2="128" stroke="#555" stroke-width="2" marker-end="url(#d)"/>
  <line x1="120" y1="178" x2="158" y2="214" stroke="#555" stroke-width="2" marker-end="url(#d)"/>
  <line x1="240" y1="218" x2="268" y2="218" stroke="#555" stroke-width="2" marker-end="url(#d)"/>
  <line x1="330" y1="126" x2="402" y2="160" stroke="#555" stroke-width="2" marker-end="url(#d)"/>
  <line x1="350" y1="218" x2="404" y2="182" stroke="#555" stroke-width="2" marker-end="url(#d)"/>
  <text x="385" y="232" font-size="12" fill="#8a4f10">× α/r = 2</text>
  <text x="255" y="270" text-anchor="middle" font-size="13" fill="#555">B 初始化为 0：训练开始时输出与原模型完全相同</text>
  <text x="255" y="292" text-anchor="middle" font-size="13" fill="#555">r = 16，α = 32，dropout = 0.05</text>

  <!-- right: LoRAWeightDelta -->
  <rect x="520" y="56" width="450" height="250" rx="12" fill="#fdf7ef" stroke="#e0b98a"/>
  <text x="745" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a4f10">LoRAWeightDelta（联合注意力 QKV 张量）</text>
  <rect x="560" y="110" width="370" height="44" rx="6" fill="#e3e3e3" stroke="#888"/>
  <text x="745" y="137" text-anchor="middle" font-size="14" fill="#333">wan_action_qkv：[3, 24, 1024, 128]（冻结）</text>
  <rect x="560" y="176" width="370" height="44" rx="6" fill="#fde3c6" stroke="#d98a2b"/>
  <text x="745" y="203" text-anchor="middle" font-size="14" fill="#333">+ (B@A).reshape(...) × α/r，B: 9216×16，A: 16×1024</text>
  <text x="745" y="250" text-anchor="middle" font-size="13" fill="#555">用 torch parametrize 挂在参数上，前向时自动相加</text>
  <text x="745" y="272" text-anchor="middle" font-size="13" fill="#555">动作分支、理解分支每层各一份</text>

  <!-- bottom: full trainable -->
  <rect x="30" y="326" width="940" height="110" rx="12" fill="#eef7ee" stroke="#4f9a57"/>
  <text x="500" y="354" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d6b33">完整训练（不是低秩）的 G2 专用参数</text>
  <text x="500" y="382" text-anchor="middle" font-size="14" fill="#333">action_expert.input_encoder（state_encoder / action_encoder）  ·  action_expert.decoder（action_head）</text>
  <text x="500" y="406" text-anchor="middle" font-size="14" fill="#333">三个分支中名字含 .norm 的参数  ·  .modulation  ·  .registers</text>
  <text x="500" y="428" text-anchor="middle" font-size="13" fill="#777">adapter_model.pt = 所有 requires_grad=True 的张量；Qwen 骨干与其余主体保持冻结</text>
</svg>
