<rect x="0" y="0" width="1060" height="400" fill="#ffffff"/>
<text x="530.0" y="34.0" font-size="22" text-anchor="middle" fill="#1f2d3d" font-weight="bold">VoxelMap3D：体素哈希表累计“和”与“次数”，导出时取均值（s = 0.08 m）</text>
