<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="940" height="400" fill="#fff"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">verify()：连续、新鲜、稳定的观测才算通过（以抬升验证 duration=1 s 为例）</text>

  <!-- 时间轴 -->
  <line x1="60" y1="200" x2="900" y2="200" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="905" y="220" font-size="12" fill="#444">仿真时间 / s</text>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <line x1="100" y1="195" x2="100" y2="205" stroke="#444"/><text x="100" y="222">0.0</text>
    <line x1="260" y1="195" x2="260" y2="205" stroke="#444"/><text x="260" y="222">0.4</text>
    <line x1="420" y1="195" x2="420" y2="205" stroke="#444"/><text x="420" y="222">0.8</text>
    <line x1="580" y1="195" x2="580" y2="205" stroke="#444"/><text x="580" y="222">1.2</text>
    <line x1="740" y1="195" x2="740" y2="205" stroke="#444"/><text x="740" y="222">1.6</text>
  </g>
  <!-- 每 0.2 s 一个样本：x = 100 + t*400 -->
  <g font-size="11" text-anchor="middle">
    <circle cx="100" cy="170" r="8" fill="#2e8b57"/><text x="100" y="150">1</text>
    <circle cx="180" cy="170" r="8" fill="#2e8b57"/><text x="180" y="150">2</text>
    <circle cx="260" cy="170" r="8" fill="#c94040"/><text x="260" y="150" fill="#c94040">跳变</text>
    <circle cx="340" cy="170" r="8" fill="#2e8b57"/><text x="340" y="150">1</text>
    <circle cx="420" cy="170" r="8" fill="#2e8b57"/><text x="420" y="150">2</text>
    <circle cx="500" cy="170" r="8" fill="#2e8b57"/><text x="500" y="150">3</text>
    <circle cx="580" cy="170" r="8" fill="#2e8b57"/><text x="580" y="150">4</text>
    <circle cx="660" cy="170" r="8" fill="#2e8b57"/><text x="660" y="150">5</text>
    <circle cx="740" cy="170" r="8" fill="#2e8b57"/><text x="740" y="150">6</text>
  </g>
  <rect x="340" y="236" width="400" height="26" rx="4" fill="#e5f6f6" stroke="#22898a"/>
  <text x="540" y="254" text-anchor="middle" font-size="12.5" fill="#14595a">first = 0.6 s 起连续跟踪；0.6 → 1.6 s 满 1.0 s 且 samples = 6 ≥ 5 → 通过</text>
  <line x1="260" y1="182" x2="260" y2="300" stroke="#c94040" stroke-dasharray="4,3"/>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#c94040">与上一样本位移 &gt; 1.5 cm</text>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#c94040">→ tracking=false，samples=0</text>

  <g font-size="12.5" fill="#333">
    <text x="60" y="66">通过一个样本需同时满足：</text>
    <text x="80" y="88">① 时间戳晚于上一个样本，且晚于进入 verify() 的时刻（不拿旧观测凑数）</text>
    <text x="80" y="108">② 距当前时间 &lt; 0.5 s；③ 判据 test(p) 为真（抬升：z &gt; 桌面 + 0.10 m）</text>
    <text x="80" y="128">④ 与前一样本位移 ≤ 0.015 m 且间隔 ≤ 0.5 s，否则重新计数</text>
  </g>
  <text x="470" y="378" text-anchor="middle" font-size="12" fill="#666">20 s 墙钟内未通过、或 ARM 模式丢失，则抛出异常 → FAILED。放置验证同理，duration = 1.5 s。</text>
</svg>
