<text x="65" y="218" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#18334B" text-anchor="start">RGB + YOLO：只选 apple</text>
<text x="65" y="249" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#18334B" text-anchor="start">矩形框内仍可能有桌面背景</text>
<rect x="535" y="145" width="425" height="130" rx="15" fill="white" stroke="#2463B5" stroke-width="2"/>
<text x="555" y="182" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#2463B5" text-anchor="start">② 反投影与坐标转换</text>
<text x="555" y="218" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#18334B" text-anchor="start">框内有效深度 + 相机内参</text>
<text x="555" y="249" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#18334B" text-anchor="start">同帧 TF：相机点 → odom 点</text>
<rect x="1025" y="145" width="425" height="130" rx="15" fill="white" stroke="#17816E" stroke-width="2"/>
<text x="1045" y="182" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#17816E" text-anchor="start">③ 几何筛选</text>
