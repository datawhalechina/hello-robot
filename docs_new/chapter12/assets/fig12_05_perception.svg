<text x="45" y="852" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#BC641D" text-anchor="start">读图要点：检测回答“在哪里”，候选回答“怎么夹”，IK 回答“够不够得着”，规划回答“怎么过去”。</text>
