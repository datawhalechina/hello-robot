<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">自回归语言模型：逐个预测下一个 token，并用因果掩码遮住“未来”</text>

  <!-- 左：逐步预测 -->
  <text x="40" y="80" font-size="16" font-weight="700" fill="#1d4ed8">(a) 训练时每个位置都在做“下一个 token”分类</text>
  <g font-size="15">
    <rect x="40" y="100" width="90" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="85" y="128" text-anchor="middle" fill="#0f172a">请</text>
    <rect x="140" y="100" width="90" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="185" y="128" text-anchor="middle" fill="#0f172a">导航</text>
    <rect x="240" y="100" width="90" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="285" y="128" text-anchor="middle" fill="#0f172a">到</text>
    <rect x="340" y="100" width="90" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="385" y="128" text-anchor="middle" fill="#0f172a">蓝色</text>
  </g>
  <rect x="40" y="170" width="390" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="235" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Transformer（带因果掩码）</text>
  <text x="235" y="220" text-anchor="middle" font-size="12" fill="#334155">位置 t 只能看到 x₁ … xₜ</text>
  <line x1="85" y1="144" x2="85" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="185" y1="144" x2="185" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="285" y1="144" x2="285" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="385" y1="144" x2="385" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="85" y1="230" x2="85" y2="256" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="185" y1="230" x2="185" y2="256" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="285" y1="230" x2="285" y2="256" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="385" y1="230" x2="385" y2="256" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <g font-size="13">
    <rect x="40" y="258" width="90" height="44" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="85" y="285" text-anchor="middle" fill="#0f172a">预测“导航”</text>
    <rect x="140" y="258" width="90" height="44" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="185" y="285" text-anchor="middle" fill="#0f172a">预测“到”</text>
    <rect x="240" y="258" width="90" height="44" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="285" y="285" text-anchor="middle" fill="#0f172a">预测“蓝色”</text>
    <rect x="340" y="258" width="90" height="44" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="385" y="285" text-anchor="middle" fill="#0f172a">预测“物体”</text>
  </g>
  <rect x="40" y="330" width="390" height="150" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="58" y="358" font-size="14" font-weight="700" fill="#92400e">位置 4 的输出分布（示意数字）</text>
  <g font-size="13" fill="#0f172a">
    <text x="58" y="386">物体</text><rect x="120" y="374" width="250" height="16" fill="#f59e0b"/><text x="378" y="386">0.50</text>
    <text x="58" y="412">盒子</text><rect x="120" y="400" width="150" height="16" fill="#fcd34d"/><text x="278" y="412">0.30</text>
    <text x="58" y="438">的</text><rect x="120" y="426" width="75" height="16" fill="#fde68a"/><text x="203" y="438">0.15</text>
    <text x="58" y="464">其他</text><rect x="120" y="452" width="25" height="16" fill="#fef3c7"/><text x="153" y="464">0.05</text>
  </g>
  <text x="240" y="412" font-size="12" fill="#92400e">真值为“物体”时</text>
  <text x="240" y="432" font-size="12" fill="#92400e">该位置损失 = −ln 0.50 ≈ 0.693</text>

  <!-- 右：因果掩码 -->
  <text x="560" y="80" font-size="16" font-weight="700" fill="#1d4ed8">(b) 因果掩码 M：行 = 当前位置（Query），列 = 被关注位置（Key）</text>
  <g font-size="14" fill="#334155">
    <text x="720" y="120" text-anchor="middle">请</text>
    <text x="800" y="120" text-anchor="middle">导航</text>
    <text x="880" y="120" text-anchor="middle">到</text>
    <text x="960" y="120" text-anchor="middle">蓝色</text>
    <text x="660" y="165" text-anchor="end">请</text>
    <text x="660" y="245" text-anchor="end">导航</text>
    <text x="660" y="325" text-anchor="end">到</text>
    <text x="660" y="405" text-anchor="end">蓝色</text>
  </g>
  <g stroke="#ffffff" stroke-width="3" font-size="15">
    <rect x="680" y="130" width="80" height="80" fill="#3b82f6"/>
    <rect x="760" y="130" width="80" height="80" fill="#e2e8f0"/>
    <rect x="840" y="130" width="80" height="80" fill="#e2e8f0"/>
    <rect x="920" y="130" width="80" height="80" fill="#e2e8f0"/>
    <rect x="680" y="210" width="80" height="80" fill="#3b82f6"/>
    <rect x="760" y="210" width="80" height="80" fill="#3b82f6"/>
    <rect x="840" y="210" width="80" height="80" fill="#e2e8f0"/>
    <rect x="920" y="210" width="80" height="80" fill="#e2e8f0"/>
    <rect x="680" y="290" width="80" height="80" fill="#3b82f6"/>
    <rect x="760" y="290" width="80" height="80" fill="#3b82f6"/>
    <rect x="840" y="290" width="80" height="80" fill="#3b82f6"/>
    <rect x="920" y="290" width="80" height="80" fill="#e2e8f0"/>
    <rect x="680" y="370" width="80" height="80" fill="#3b82f6"/>
    <rect x="760" y="370" width="80" height="80" fill="#3b82f6"/>
    <rect x="840" y="370" width="80" height="80" fill="#3b82f6"/>
    <rect x="920" y="370" width="80" height="80" fill="#3b82f6"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <text x="720" y="176" fill="#ffffff">0</text><text x="800" y="176" fill="#64748b">−∞</text><text x="880" y="176" fill="#64748b">−∞</text><text x="960" y="176" fill="#64748b">−∞</text>
    <text x="720" y="256" fill="#ffffff">0</text><text x="800" y="256" fill="#ffffff">0</text><text x="880" y="256" fill="#64748b">−∞</text><text x="960" y="256" fill="#64748b">−∞</text>
    <text x="720" y="336" fill="#ffffff">0</text><text x="800" y="336" fill="#ffffff">0</text><text x="880" y="336" fill="#ffffff">0</text><text x="960" y="336" fill="#64748b">−∞</text>
    <text x="720" y="416" fill="#ffffff">0</text><text x="800" y="416" fill="#ffffff">0</text><text x="880" y="416" fill="#ffffff">0</text><text x="960" y="416" fill="#ffffff">0</text>
  </g>
  <rect x="680" y="468" width="18" height="18" fill="#3b82f6"/><text x="706" y="482" font-size="13" fill="#334155">允许关注（M=0）</text>
  <rect x="840" y="468" width="18" height="18" fill="#e2e8f0"/><text x="866" y="482" font-size="13" fill="#334155">屏蔽未来（M=−∞，softmax 后权重为 0）</text>
</svg>
