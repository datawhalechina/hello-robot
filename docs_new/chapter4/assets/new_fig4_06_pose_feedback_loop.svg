<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="k" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">二维位姿反馈控制：闭环结构与比例控制的速度曲线</text>

  <!-- loop -->
  <g font-size="14" fill="#0f172a" text-anchor="middle">
    <rect x="20" y="70" width="130" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="85" y="100" font-weight="700">目标位姿</text><text x="85" y="122" font-size="12">(x_t, y_t, ψ_t)</text>

    <circle cx="195" cy="105" r="18" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="195" y="110">−</text>

    <rect x="240" y="70" width="160" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="98" font-weight="700">① 世界误差</text><text x="320" y="120" font-size="12">e_x^w, e_y^w, e_d, e_ψ</text>

    <rect x="430" y="70" width="160" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="510" y="98" font-weight="700">② 旋转到底盘系</text><text x="510" y="120" font-size="12">R(−ψ) · e^world</text>

    <rect x="620" y="70" width="160" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="700" y="98" font-weight="700">③ 比例控制+限幅</text><text x="700" y="120" font-size="12">Kp=1.2, Kψ=2.0</text>

    <rect x="810" y="70" width="170" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="895" y="98" font-weight="700">④ G2BaseController</text><text x="895" y="120" font-size="12">逆运动学 → 8 关节</text>

    <rect x="810" y="180" width="170" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="895" y="206" font-weight="700">Isaac Sim 物理步进</text><text x="895" y="226" font-size="12">simulation.step()</text>

    <rect x="430" y="180" width="300" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="580" y="206" font-weight="700">⑤ 读取当前位姿 get_pose2d()</text><text x="580" y="226" font-size="12">位置取 x、y；四元数转换为 yaw</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#k)">
    <line x1="150" y1="105" x2="173" y2="105"/>
    <line x1="213" y1="105" x2="236" y2="105"/>
    <line x1="400" y1="105" x2="426" y2="105"/>
    <line x1="590" y1="105" x2="616" y2="105"/>
    <line x1="780" y1="105" x2="806" y2="105"/>
    <line x1="895" y1="140" x2="895" y2="176"/>
    <line x1="810" y1="210" x2="734" y2="210"/>
  </g>
  <path d="M430 210 L195 210 L195 127" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <text x="310" y="200" text-anchor="middle" font-size="12" fill="#16a34a">每 1/120 s 反馈一次</text>
  <text x="700" y="160" text-anchor="middle" font-size="12" fill="#475569">e_d ≤ 0.04 m 且 |e_ψ| ≤ 0.05 rad → 到达，stop()</text>

  <!-- plot: speed vs distance. origin (110,540), x: 0..1.0 m -> 400px, y: 0..0.8 m/s -> 240px -->
  <text x="90" y="290" font-size="15" font-weight="700" fill="#0f172a">平移速度指令与距离误差的关系（沿车头方向的单一误差）</text>
  <g stroke="#e2e8f0">
    <line x1="110" y1="480" x2="510" y2="480"/><line x1="110" y1="420" x2="510" y2="420"/>
    <line x1="110" y1="360" x2="510" y2="360"/>
  </g>
  <line x1="110" y1="540" x2="515" y2="540" stroke="#475569" stroke-width="1.5"/>
  <line x1="110" y1="540" x2="110" y2="320" stroke="#475569" stroke-width="1.5"/>
  <g font-size="12" fill="#64748b">
    <text x="102" y="544" text-anchor="end">0</text><text x="102" y="484" text-anchor="end">0.2</text>
    <text x="102" y="424" text-anchor="end">0.4</text><text x="102" y="364" text-anchor="end">0.6</text>
    <text x="110" y="558" text-anchor="middle">0</text><text x="210" y="558" text-anchor="middle">0.25</text>
    <text x="310" y="558" text-anchor="middle">0.5</text><text x="410" y="558" text-anchor="middle">0.75</text><text x="510" y="558" text-anchor="middle">1.0</text>
    <text x="310" y="580" text-anchor="middle">距离误差 e_d / m</text>
    <text x="40" y="430" text-anchor="middle" transform="rotate(-90 40 430)">|v| 指令 / m·s⁻¹</text>
  </g>
  <!-- tolerance band 0.04 -->
  <rect x="110" y="320" width="16" height="220" fill="#dcfce7"/>
  <text x="130" y="335" font-size="11" fill="#166534">容差 0.04 m</text>
  <!-- curve: v=1.2 e until 0.55 at e=0.458 -->
  <polyline points="126,525.6 293.3,375 510,375" fill="none" stroke="#2563eb" stroke-width="2"/>
  <line x1="126" y1="540" x2="126" y2="525.6" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="293.3" cy="375" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <text x="300" y="368" font-size="12" fill="#334155">饱和点 e_d ≈ 0.458 m</text>
  <text x="420" y="395" font-size="12" fill="#334155">限幅 0.55 m/s</text>
  <text x="170" y="470" font-size="12" fill="#334155">v = 1.2·e_d</text>

  <!-- example panel -->
  <rect x="570" y="275" width="410" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="590" y="305" font-size="15" font-weight="700" fill="#0f172a">手算：从航点 1 出发去航点 2</text>
  <g font-size="13" fill="#0f172a">
    <text x="590" y="333">当前 (1.0, 0.0, 0)，目标 (1.0, 1.0, π/2)</text>
    <text x="590" y="358">e^world = (0, 1.0)，e_d = 1.0，e_ψ = π/2 ≈ 1.571</text>
    <text x="590" y="383">ψ = 0 → e^body = (0, 1.0)</text>
    <text x="590" y="408">比例输出：vx = 0，vy = 1.2，ωz = 3.142</text>
    <text x="590" y="433">线速度限幅 0.55：vy = 0.55</text>
    <text x="590" y="458">角速度限幅 1.0：ωz = 1.0</text>
    <text x="590" y="488" font-weight="700">→ 指令 (vx, vy, ωz) = (0, 0.55, 1.0)</text>
    <text x="590" y="518" fill="#475569">机器人一边向左横移，一边逆时针转头；</text>
    <text x="590" y="540" fill="#475569">之后 ψ 变化，e^body 每个周期重新计算，</text>
    <text x="590" y="562" fill="#475569">所以在世界系中仍然朝目标点前进。</text>
  </g>
</svg>
