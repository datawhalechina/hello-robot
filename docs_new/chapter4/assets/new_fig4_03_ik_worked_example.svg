<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="k" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="730" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">逆运动学手算：vx = 0.4 m/s，vy = 0，ωz = 0.5 rad/s（边前进边左转）</text>

  <!-- ICR lines -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="120" y1="300" x2="469" y2="162"/>
    <line x1="120" y1="300" x2="469" y2="438"/>
    <line x1="120" y1="300" x2="731" y2="162"/>
    <line x1="120" y1="300" x2="731" y2="438"/>
  </g>
  <circle cx="120" cy="300" r="7" fill="#dc2626"/>
  <text x="60" y="335" font-size="13" fill="#dc2626">瞬时旋转中心 ICR</text>
  <text x="60" y="355" font-size="13" fill="#dc2626">位于左侧 vx/ωz = 0.8 m</text>

  <!-- body -->
  <rect x="470" y="140" width="260" height="320" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <path d="M575 140 L600 118 L625 140" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <circle cx="600" cy="300" r="5" fill="#0f172a"/>
  <line x1="600" y1="300" x2="600" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <line x1="600" y1="300" x2="540" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <text x="606" y="240" font-size="13" fill="#334155">+x</text>
  <text x="535" y="292" font-size="13" fill="#334155">+y</text>

  <!-- wheels (rolling direction) -->
  <g stroke="#1e293b" stroke-width="12" stroke-linecap="round">
    <line x1="476.3" y1="180.6" x2="461.7" y2="143.4"/>
    <line x1="735.4" y1="181.5" x2="726.6" y2="142.5"/>
    <line x1="461.7" y1="456.6" x2="476.3" y2="419.4"/>
    <line x1="726.6" y1="457.5" x2="735.4" y2="418.5"/>
  </g>

  <!-- LF decomposition -->
  <line x1="469" y1="162" x2="469" y2="84" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <line x1="469" y1="82" x2="448" y2="102" stroke="#ea580c" stroke-width="3" marker-end="url(#o)"/>
  <line x1="469" y1="162" x2="447" y2="106" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <text x="476" y="78" font-size="12" fill="#2563eb">平移 (0.4, 0)</text>
  <text x="300" y="100" font-size="12" fill="#ea580c">旋转 (−0.109, 0.115)</text>

  <!-- other wheels green -->
  <line x1="731" y1="162" x2="709" y2="62" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <line x1="469" y1="438" x2="491" y2="382" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <line x1="731" y1="438" x2="754" y2="336" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>

  <g font-size="14" font-weight="700" fill="#0f172a">
    <text x="400" y="190">LF</text>
    <text x="760" y="190">RF</text>
    <text x="400" y="470">LR</text>
    <text x="760" y="470">RR</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#0f172a">
    <line x1="800" y1="90" x2="840" y2="90" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text x="850" y="95">平移速度 v_c</text>
    <line x1="800" y1="118" x2="840" y2="118" stroke="#ea580c" stroke-width="3" marker-end="url(#o)"/><text x="850" y="123">旋转速度 ω×r_i</text>
    <line x1="800" y1="146" x2="840" y2="146" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/><text x="850" y="151">轮心合速度 v_i</text>
    <line x1="800" y1="174" x2="840" y2="174" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/><text x="850" y="179">车轮朝向 θ_i</text>
  </g>
  <text x="800" y="260" font-size="12" fill="#475569">右侧两轮离 ICR 更远，</text>
  <text x="800" y="280" font-size="12" fill="#475569">所以转得更快（约 7.45 rad/s）；</text>
  <text x="800" y="300" font-size="12" fill="#475569">左侧两轮离 ICR 更近，</text>
  <text x="800" y="320" font-size="12" fill="#475569">所以转得更慢（约 4.47 rad/s）。</text>

  <!-- table -->
  <rect x="40" y="500" width="920" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="14" fill="#0f172a">
    <g font-weight="700">
      <text x="60" y="532">轮子</text><text x="150" y="532">(x_i, y_i) / m</text>
      <text x="330" y="532">v_ix = vx − ωz·y_i</text><text x="520" y="532">v_iy = vy + ωz·x_i</text>
      <text x="700" y="532">θ_i</text><text x="790" y="532">ω_i = |v_i| / r</text>
    </g>
    <line x1="55" y1="544" x2="945" y2="544" stroke="#cbd5e1"/>
    <text x="60" y="574">LF</text><text x="150" y="574">(+0.230, +0.218)</text><text x="330" y="574">0.4 − 0.109 = 0.291</text><text x="520" y="574">0 + 0.115 = 0.115</text><text x="700" y="574">+21.6°</text><text x="790" y="574">0.313/0.07 ≈ 4.47</text>
    <text x="60" y="608">LR</text><text x="150" y="608">(−0.230, +0.218)</text><text x="330" y="608">0.4 − 0.109 = 0.291</text><text x="520" y="608">0 − 0.115 = −0.115</text><text x="700" y="608">−21.6°</text><text x="790" y="608">0.313/0.07 ≈ 4.47</text>
    <text x="60" y="642">RF</text><text x="150" y="642">(+0.230, −0.218)</text><text x="330" y="642">0.4 + 0.109 = 0.509</text><text x="520" y="642">0 + 0.115 = 0.115</text><text x="700" y="642">+12.7°</text><text x="790" y="642">0.522/0.07 ≈ 7.45</text>
    <text x="60" y="676">RR</text><text x="150" y="676">(−0.230, −0.218)</text><text x="330" y="676">0.4 + 0.109 = 0.509</text><text x="520" y="676">0 − 0.115 = −0.115</text><text x="700" y="676">−12.7°</text><text x="790" y="676">0.522/0.07 ≈ 7.45</text>
  </g>
  <text x="500" y="702" text-anchor="middle" font-size="12" fill="#64748b">速度单位 m/s，轮速单位 rad/s；图为示意图，箭头长度与速度大小成比例，ICR 连线与各轮速度方向垂直</text>
</svg>
