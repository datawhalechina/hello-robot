<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>text{font-family:PingFang SC, Microsoft YaHei, sans-serif;fill:#0f172a}.b{font-weight:700}.h{font-size:22px}.m{font-size:16px}.s{font-size:13px}</style>
  </defs>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" class="b h">π0.5 结构：论文完整形态（上）与本章 OpenPI 实现（下）</text>

  <!-- paper version -->
  <rect x="30" y="60" width="1040" height="250" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="50" y="86" class="b m">论文（arXiv 2504.16054）描述的推理流程</text>
  <rect x="60" y="105" width="210" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="165" y="133" text-anchor="middle" class="b m">图像 + 高层指令</text><text x="165" y="156" text-anchor="middle" class="s">"clean the kitchen"</text>
  <rect x="320" y="105" width="250" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="445" y="133" text-anchor="middle" class="b m">① 高层：VLM 生成文本</text><text x="445" y="156" text-anchor="middle" class="s">子任务 "pick up the plate"</text>
  <rect x="620" y="105" width="420" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="830" y="133" text-anchor="middle" class="b m">② 低层：动作专家 flow matching</text><text x="830" y="156" text-anchor="middle" class="s">以子任务为条件输出连续动作块（H = 50）</text>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arr)"><line x1="272" y1="140" x2="316" y2="140"/><line x1="572" y1="140" x2="616" y2="140"/></g>
  <rect x="60" y="200" width="460" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="290" y="226" text-anchor="middle" class="b s">预训练：全部任务用离散 token</text>
  <text x="290" y="250" text-anchor="middle" class="s">机器人动作 = FAST token；另有子任务标注、网页 VLM 数据、</text>
  <text x="290" y="272" text-anchor="middle" class="s">目标检测等，多机器人异构数据协同训练</text>
  <rect x="560" y="200" width="480" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="800" y="226" text-anchor="middle" class="b s">后训练：加入动作专家（flow matching）</text>
  <text x="800" y="250" text-anchor="middle" class="s">FAST token 与连续动作同时监督；动作专家 token</text>
  <text x="800" y="272" text-anchor="middle" class="s">看不到 FAST token，避免两种动作表示互相泄露</text>

  <!-- openpi version -->
  <rect x="30" y="330" width="1040" height="270" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="356" class="b m">本章 OpenPI（Pi0Config(pi05=True)）实际运行的部分</text>
  <rect x="60" y="375" width="230" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="175" y="401" text-anchor="middle" class="b m">3 路相机图像</text><text x="175" y="423" text-anchor="middle" class="s">base / left_wrist / right_wrist</text>
  <rect x="60" y="452" width="230" height="78" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="175" y="476" text-anchor="middle" class="b s">"Task: pick up the red block…,</text>
  <text x="175" y="497" text-anchor="middle" class="b s">State: 131 87 …;\nAction: "</text>
  <text x="175" y="519" text-anchor="middle" class="s">状态离散进前缀文本</text>
  <rect x="340" y="375" width="260" height="155" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="405" text-anchor="middle" class="b m">PaliGemma 前缀（gemma_2b）</text>
  <text x="470" y="432" text-anchor="middle" class="s">图像 + 文本（含状态）双向注意力</text>
  <text x="470" y="456" text-anchor="middle" class="s">只算一次 → KV cache</text>
  <text x="470" y="480" text-anchor="middle" class="s">不生成子任务文本</text>
  <text x="470" y="504" text-anchor="middle" class="s">（本章代码不包含高层推理）</text>
  <rect x="650" y="375" width="250" height="155" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="775" y="405" text-anchor="middle" class="b m">动作专家（gemma_300m）</text>
  <text x="775" y="432" text-anchor="middle" class="s">输入：H 个带噪动作 token</text>
  <text x="775" y="456" text-anchor="middle" class="s">无状态 token</text>
  <text x="775" y="480" text-anchor="middle" class="s">时间 t → time_mlp →</text>
  <text x="775" y="504" text-anchor="middle" class="s">adaRMSNorm 注入每一层</text>
  <rect x="930" y="400" width="120" height="105" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="990" y="430" text-anchor="middle" class="b s">v_t [H,32]</text><text x="990" y="455" text-anchor="middle" class="s">10 步 Euler</text><text x="990" y="480" text-anchor="middle" class="s">→ 动作块</text>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"><line x1="292" y1="407" x2="336" y2="430"/><line x1="292" y1="490" x2="336" y2="475"/><line x1="602" y1="452" x2="646" y2="452"/><line x1="902" y1="452" x2="926" y2="452"/></g>
  <text x="550" y="572" text-anchor="middle" class="s">高层子任务由本章 task_intent.py 的确定性规则代替（red → green → blue），不是论文中学出来的高层推理</text>
</svg>
