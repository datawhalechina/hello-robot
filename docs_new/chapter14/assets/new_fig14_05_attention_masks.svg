<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <style>text{font-family:PingFang SC, Microsoft YaHei, sans-serif;fill:#0f172a}.b{font-weight:700}.h{font-size:22px}.m{font-size:16px}.s{font-size:13px}</style>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" class="b h">make_attn_mask 的块状注意力（行 = Query，列 = Key，深色 = 可以看到）</text>

  <!-- pi0 matrix 7x7, cell 40, origin x=110,y=130 -->
  <text x="250" y="80" text-anchor="middle" class="b m">π0：mask_ar = [0,0,0, 1, 1,0,0]</text>
  <text x="250" y="104" text-anchor="middle" class="s">cumsum = [0,0,0, 1, 2,2,2]</text>
  <g font-size="13">
    <text x="100" y="155" text-anchor="end" class="s">图像1</text><text x="100" y="195" text-anchor="end" class="s">图像2</text><text x="100" y="235" text-anchor="end" class="s">文本</text><text x="100" y="275" text-anchor="end" class="s">状态</text><text x="100" y="315" text-anchor="end" class="s">动作1</text><text x="100" y="355" text-anchor="end" class="s">动作2</text><text x="100" y="395" text-anchor="end" class="s">动作3</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <!-- rows 0-2: cols 0-2 -->
    <rect x="110" y="130" width="40" height="40" fill="#2563eb"/><rect x="150" y="130" width="40" height="40" fill="#2563eb"/><rect x="190" y="130" width="40" height="40" fill="#2563eb"/><rect x="230" y="130" width="40" height="40" fill="#e2e8f0"/><rect x="270" y="130" width="40" height="40" fill="#e2e8f0"/><rect x="310" y="130" width="40" height="40" fill="#e2e8f0"/><rect x="350" y="130" width="40" height="40" fill="#e2e8f0"/>
    <rect x="110" y="170" width="40" height="40" fill="#2563eb"/><rect x="150" y="170" width="40" height="40" fill="#2563eb"/><rect x="190" y="170" width="40" height="40" fill="#2563eb"/><rect x="230" y="170" width="40" height="40" fill="#e2e8f0"/><rect x="270" y="170" width="40" height="40" fill="#e2e8f0"/><rect x="310" y="170" width="40" height="40" fill="#e2e8f0"/><rect x="350" y="170" width="40" height="40" fill="#e2e8f0"/>
    <rect x="110" y="210" width="40" height="40" fill="#2563eb"/><rect x="150" y="210" width="40" height="40" fill="#2563eb"/><rect x="190" y="210" width="40" height="40" fill="#2563eb"/><rect x="230" y="210" width="40" height="40" fill="#e2e8f0"/><rect x="270" y="210" width="40" height="40" fill="#e2e8f0"/><rect x="310" y="210" width="40" height="40" fill="#e2e8f0"/><rect x="350" y="210" width="40" height="40" fill="#e2e8f0"/>
    <!-- row 3 state -->
    <rect x="110" y="250" width="40" height="40" fill="#0f766e"/><rect x="150" y="250" width="40" height="40" fill="#0f766e"/><rect x="190" y="250" width="40" height="40" fill="#0f766e"/><rect x="230" y="250" width="40" height="40" fill="#0f766e"/><rect x="270" y="250" width="40" height="40" fill="#e2e8f0"/><rect x="310" y="250" width="40" height="40" fill="#e2e8f0"/><rect x="350" y="250" width="40" height="40" fill="#e2e8f0"/>
    <!-- rows 4-6 actions -->
    <rect x="110" y="290" width="40" height="40" fill="#d97706"/><rect x="150" y="290" width="40" height="40" fill="#d97706"/><rect x="190" y="290" width="40" height="40" fill="#d97706"/><rect x="230" y="290" width="40" height="40" fill="#d97706"/><rect x="270" y="290" width="40" height="40" fill="#d97706"/><rect x="310" y="290" width="40" height="40" fill="#d97706"/><rect x="350" y="290" width="40" height="40" fill="#d97706"/>
    <rect x="110" y="330" width="40" height="40" fill="#d97706"/><rect x="150" y="330" width="40" height="40" fill="#d97706"/><rect x="190" y="330" width="40" height="40" fill="#d97706"/><rect x="230" y="330" width="40" height="40" fill="#d97706"/><rect x="270" y="330" width="40" height="40" fill="#d97706"/><rect x="310" y="330" width="40" height="40" fill="#d97706"/><rect x="350" y="330" width="40" height="40" fill="#d97706"/>
    <rect x="110" y="370" width="40" height="40" fill="#d97706"/><rect x="150" y="370" width="40" height="40" fill="#d97706"/><rect x="190" y="370" width="40" height="40" fill="#d97706"/><rect x="230" y="370" width="40" height="40" fill="#d97706"/><rect x="270" y="370" width="40" height="40" fill="#d97706"/><rect x="310" y="370" width="40" height="40" fill="#d97706"/><rect x="350" y="370" width="40" height="40" fill="#d97706"/>
  </g>

  <!-- pi05 matrix 7x7 origin x=600 -->
  <text x="790" y="80" text-anchor="middle" class="b m">π0.5：mask_ar = [0,0,0,0, 1,0,0]</text>
  <text x="790" y="104" text-anchor="middle" class="s">状态已离散化进文本，后缀只有动作 token</text>
  <g>
    <text x="640" y="155" text-anchor="end" class="s">图像1</text><text x="640" y="195" text-anchor="end" class="s">图像2</text><text x="640" y="235" text-anchor="end" class="s">文本</text><text x="640" y="275" text-anchor="end" class="s">状态文本</text><text x="640" y="315" text-anchor="end" class="s">动作1</text><text x="640" y="355" text-anchor="end" class="s">动作2</text><text x="640" y="395" text-anchor="end" class="s">动作3</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <rect x="650" y="130" width="40" height="40" fill="#2563eb"/><rect x="690" y="130" width="40" height="40" fill="#2563eb"/><rect x="730" y="130" width="40" height="40" fill="#2563eb"/><rect x="770" y="130" width="40" height="40" fill="#2563eb"/><rect x="810" y="130" width="40" height="40" fill="#e2e8f0"/><rect x="850" y="130" width="40" height="40" fill="#e2e8f0"/><rect x="890" y="130" width="40" height="40" fill="#e2e8f0"/>
    <rect x="650" y="170" width="40" height="40" fill="#2563eb"/><rect x="690" y="170" width="40" height="40" fill="#2563eb"/><rect x="730" y="170" width="40" height="40" fill="#2563eb"/><rect x="770" y="170" width="40" height="40" fill="#2563eb"/><rect x="810" y="170" width="40" height="40" fill="#e2e8f0"/><rect x="850" y="170" width="40" height="40" fill="#e2e8f0"/><rect x="890" y="170" width="40" height="40" fill="#e2e8f0"/>
    <rect x="650" y="210" width="40" height="40" fill="#2563eb"/><rect x="690" y="210" width="40" height="40" fill="#2563eb"/><rect x="730" y="210" width="40" height="40" fill="#2563eb"/><rect x="770" y="210" width="40" height="40" fill="#2563eb"/><rect x="810" y="210" width="40" height="40" fill="#e2e8f0"/><rect x="850" y="210" width="40" height="40" fill="#e2e8f0"/><rect x="890" y="210" width="40" height="40" fill="#e2e8f0"/>
    <rect x="650" y="250" width="40" height="40" fill="#2563eb"/><rect x="690" y="250" width="40" height="40" fill="#2563eb"/><rect x="730" y="250" width="40" height="40" fill="#2563eb"/><rect x="770" y="250" width="40" height="40" fill="#2563eb"/><rect x="810" y="250" width="40" height="40" fill="#e2e8f0"/><rect x="850" y="250" width="40" height="40" fill="#e2e8f0"/><rect x="890" y="250" width="40" height="40" fill="#e2e8f0"/>
    <rect x="650" y="290" width="40" height="40" fill="#d97706"/><rect x="690" y="290" width="40" height="40" fill="#d97706"/><rect x="730" y="290" width="40" height="40" fill="#d97706"/><rect x="770" y="290" width="40" height="40" fill="#d97706"/><rect x="810" y="290" width="40" height="40" fill="#d97706"/><rect x="850" y="290" width="40" height="40" fill="#d97706"/><rect x="890" y="290" width="40" height="40" fill="#d97706"/>
    <rect x="650" y="330" width="40" height="40" fill="#d97706"/><rect x="690" y="330" width="40" height="40" fill="#d97706"/><rect x="730" y="330" width="40" height="40" fill="#d97706"/><rect x="770" y="330" width="40" height="40" fill="#d97706"/><rect x="810" y="330" width="40" height="40" fill="#d97706"/><rect x="850" y="330" width="40" height="40" fill="#d97706"/><rect x="890" y="330" width="40" height="40" fill="#d97706"/>
    <rect x="650" y="370" width="40" height="40" fill="#d97706"/><rect x="690" y="370" width="40" height="40" fill="#d97706"/><rect x="730" y="370" width="40" height="40" fill="#d97706"/><rect x="770" y="370" width="40" height="40" fill="#d97706"/><rect x="810" y="370" width="40" height="40" fill="#d97706"/><rect x="850" y="370" width="40" height="40" fill="#d97706"/><rect x="890" y="370" width="40" height="40" fill="#d97706"/>
  </g>

  <rect x="80" y="440" width="940" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="550" y="470" text-anchor="middle" class="m">规则：token i 能看 token j，当且仅当 cumsum[j] ≤ cumsum[i]（且两者都不是 padding）</text>
  <text x="550" y="496" text-anchor="middle" class="s">蓝 = 前缀（图像/文本）只看前缀；绿 = π0 的状态 token 看前缀和自己；橙 = 动作 token 看全部且彼此双向</text>
  <text x="550" y="520" text-anchor="middle" class="s">结果：前缀永远看不到动作，所以前缀的 KV 与带噪动作无关，推理时可以只算一次并缓存</text>
</svg>
