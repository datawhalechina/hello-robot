<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>text{font-family:PingFang SC, Microsoft YaHei, sans-serif;fill:#0f172a}.b{font-weight:700}.h{font-size:22px}.m{font-size:16px}.s{font-size:13px}</style>
  </defs>
  <rect width="1100" height="600" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" class="b h">π0 结构：PaliGemma 前缀 + 动作专家后缀（OpenPI Pi0, pi05=False）</text>

  <!-- inputs -->
  <rect x="40" y="80" width="200" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="140" y="106" text-anchor="middle" class="b m">多路相机图像</text>
  <text x="140" y="127" text-anchor="middle" class="s">224×224，每路一组 token</text>
  <rect x="40" y="160" width="200" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="140" y="186" text-anchor="middle" class="b m">语言指令</text>
  <text x="140" y="207" text-anchor="middle" class="s">PaligemmaTokenizer</text>
  <rect x="40" y="300" width="200" height="60" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="140" y="326" text-anchor="middle" class="b m">机器人状态 q_t</text>
  <text x="140" y="347" text-anchor="middle" class="s">连续向量（32 维）</text>
  <rect x="40" y="380" width="200" height="60" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="140" y="406" text-anchor="middle" class="b m">带噪动作块 x_t</text>
  <text x="140" y="427" text-anchor="middle" class="s">[H, 32]，H 默认 50</text>
  <rect x="40" y="460" width="200" height="60" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="140" y="486" text-anchor="middle" class="b m">流时间 t</text>
  <text x="140" y="507" text-anchor="middle" class="s">正余弦编码</text>

  <!-- encoders -->
  <rect x="300" y="80" width="190" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="395" y="106" text-anchor="middle" class="b m">SigLIP So400m/14</text>
  <text x="395" y="127" text-anchor="middle" class="s">图像 → token</text>
  <rect x="300" y="160" width="190" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="395" y="186" text-anchor="middle" class="b m">词嵌入 embed</text>
  <text x="395" y="207" text-anchor="middle" class="s">文本 → token</text>
  <rect x="300" y="300" width="190" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="395" y="326" text-anchor="middle" class="b m">state_proj</text>
  <text x="395" y="347" text-anchor="middle" class="s">1 个状态 token</text>
  <rect x="300" y="400" width="190" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="395" y="428" text-anchor="middle" class="b m">action_in_proj</text>
  <text x="395" y="452" text-anchor="middle" class="s">+ 时间编码拼接</text>
  <text x="395" y="474" text-anchor="middle" class="s">action_time_mlp</text>
  <text x="395" y="493" text-anchor="middle" class="s">H 个动作 token</text>

  <!-- transformer -->
  <rect x="550" y="70" width="270" height="170" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="685" y="105" text-anchor="middle" class="b m">专家 0：PaliGemma（gemma_2b）</text>
  <text x="685" y="132" text-anchor="middle" class="s">width 2048，18 层</text>
  <text x="685" y="156" text-anchor="middle" class="s">处理前缀：图像 + 文本</text>
  <text x="685" y="180" text-anchor="middle" class="s">前缀内部双向注意力</text>
  <text x="685" y="204" text-anchor="middle" class="s">推理时只算一次，缓存 KV</text>
  <rect x="550" y="300" width="270" height="200" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="685" y="335" text-anchor="middle" class="b m">专家 1：动作专家（gemma_300m）</text>
  <text x="685" y="362" text-anchor="middle" class="s">width 1024，18 层</text>
  <text x="685" y="386" text-anchor="middle" class="s">处理后缀：状态 + 动作 token</text>
  <text x="685" y="410" text-anchor="middle" class="s">每层与前缀共享注意力</text>
  <text x="685" y="434" text-anchor="middle" class="s">（读前缀的 K/V）</text>
  <text x="685" y="458" text-anchor="middle" class="s">动作 token 之间双向注意力</text>
  <line x1="685" y1="242" x2="685" y2="296" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="700" y="275" class="s">K/V 单向流入后缀</text>

  <!-- output -->
  <rect x="870" y="360" width="190" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="965" y="390" text-anchor="middle" class="b m">action_out_proj</text>
  <text x="965" y="414" text-anchor="middle" class="s">速度场 v_t：[H, 32]</text>
  <rect x="870" y="470" width="190" height="70" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="965" y="498" text-anchor="middle" class="b s">Euler：x ← x + dt·v</text>
  <text x="965" y="520" text-anchor="middle" class="s">默认 10 步得到动作块</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="242" y1="110" x2="296" y2="110"/>
    <line x1="242" y1="190" x2="296" y2="190"/>
    <line x1="242" y1="330" x2="296" y2="330"/>
    <line x1="242" y1="410" x2="296" y2="430"/>
    <line x1="242" y1="490" x2="296" y2="470"/>
    <line x1="492" y1="110" x2="546" y2="130"/>
    <line x1="492" y1="190" x2="546" y2="170"/>
    <line x1="492" y1="330" x2="546" y2="360"/>
    <line x1="492" y1="450" x2="546" y2="430"/>
    <line x1="822" y1="400" x2="866" y2="400"/>
    <line x1="965" y1="442" x2="965" y2="466"/>
    <path d="M868,505 C800,560 300,570 140,524"/>
  </g>
  <text x="520" y="580" text-anchor="middle" class="s">新的 x 作为下一步的带噪动作重新输入后缀（前缀 KV 缓存不变）</text>
</svg>
