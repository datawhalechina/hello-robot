<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3b4a5f"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2d3d">把物块入盒任务写成马尔可夫决策过程（MDP）</text>

  <rect x="80" y="110" width="280" height="200" rx="14" fill="#eef4ff" stroke="#3b6fc4" stroke-width="2"/>
  <text x="220" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d">智能体：π0.5 策略 π<tspan font-size="13" dy="4">θ</tspan></text>
  <text x="220" y="180" text-anchor="middle" font-size="14" fill="#1f2d3d">输入观察 o<tspan font-size="11" dy="3">t</tspan><tspan dy="-3"> 与任务 ℓ</tspan></text>
  <text x="220" y="205" text-anchor="middle" font-size="14" fill="#1f2d3d">一次输出 50 步动作块</text>
  <text x="220" y="230" text-anchor="middle" font-size="14" fill="#1f2d3d">逐帧弹出执行（10 Hz）</text>
  <text x="220" y="265" text-anchor="middle" font-size="13" fill="#5b6b82">policy_client.RemotePolicy</text>

  <rect x="640" y="110" width="280" height="200" rx="14" fill="#eaf7ee" stroke="#2f9e57" stroke-width="2"/>
  <text x="780" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d">环境：Isaac Sim + G2</text>
  <text x="780" y="180" text-anchor="middle" font-size="14" fill="#1f2d3d">物理 120 Hz，记录 10 Hz</text>
  <text x="780" y="205" text-anchor="middle" font-size="14" fill="#1f2d3d">三色物块 + 盒子</text>
  <text x="780" y="230" text-anchor="middle" font-size="14" fill="#1f2d3d">success() 几何判定</text>
  <text x="780" y="265" text-anchor="middle" font-size="13" fill="#5b6b82">simulation.py / robot.py</text>

  <path d="M360 160 H636" stroke="#3b4a5f" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="498" y="148" text-anchor="middle" font-size="15" fill="#1f2d3d">动作 a<tspan font-size="11" dy="3">t</tspan><tspan dy="-3">：16 维绝对关节/夹爪目标</tspan></text>

  <path d="M640 260 H364" stroke="#3b4a5f" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="498" y="250" text-anchor="middle" font-size="15" fill="#1f2d3d">新观察 o<tspan font-size="11" dy="3">t+1</tspan><tspan dy="-3">：三路图像 + 16 维状态</tspan></text>
  <text x="498" y="285" text-anchor="middle" font-size="15" fill="#d9822b">奖励 r<tspan font-size="11" dy="3">t</tspan><tspan dy="-3">：每步 −1，成功 0，失败 −C_fail</tspan></text>

  <rect x="80" y="335" width="840" height="60" rx="10" fill="#f6f7f9" stroke="#c8d1dc"/>
  <text x="500" y="360" text-anchor="middle" font-size="14" fill="#1f2d3d">一条 episode：o₀, a₀, r₀, o₁, a₁, r₁, …, o<tspan font-size="11" dy="3">T−1</tspan><tspan dy="-3">, a</tspan><tspan font-size="11" dy="3">T−1</tspan><tspan dy="-3">, r</tspan><tspan font-size="11" dy="3">T−1</tspan><tspan dy="-3">（成功 / 超时 / 纠正失败时结束）</tspan></text>
  <text x="500" y="383" text-anchor="middle" font-size="13" fill="#5b6b82">回报 G_t = 从 t 开始所有后续奖励之和（本章 γ = 1，不打折扣）</text>
</svg>
