<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3b4a5f"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2d3d">模块调用关系与数据流（code/code_chapter15）</text>

  <g font-size="13" fill="#1f2d3d">
    <!-- row 1: collection -->
    <rect x="30" y="70" width="190" height="70" rx="8" fill="#eef4ff" stroke="#3b6fc4"/>
    <text x="125" y="98" text-anchor="middle" font-weight="700">serve_policy.py</text>
    <text x="125" y="120" text-anchor="middle">pi05_adapter + OpenPI</text>

    <rect x="290" y="70" width="210" height="70" rx="8" fill="#fff4e8" stroke="#d9822b"/>
    <text x="395" y="98" text-anchor="middle" font-weight="700">collect_rollouts.py</text>
    <text x="395" y="120" text-anchor="middle">policy_client / hil / rollout_core</text>

    <rect x="290" y="165" width="210" height="50" rx="8" fill="#fff4e8" stroke="#d9822b"/>
    <text x="395" y="195" text-anchor="middle">auto_expert.py + kinematics.py</text>

    <rect x="570" y="70" width="190" height="70" rx="8" fill="#f6f7f9" stroke="#9aa5b4"/>
    <text x="665" y="98" text-anchor="middle" font-weight="700">data/raw/round_xxx</text>
    <text x="665" y="120" text-anchor="middle">episode_*.npz（dataset.py）</text>

    <rect x="570" y="165" width="190" height="50" rx="8" fill="#f6f7f9" stroke="#9aa5b4"/>
    <text x="665" y="195" text-anchor="middle">data/raw/demonstrations</text>

    <rect x="810" y="165" width="160" height="50" rx="8" fill="#fff4e8" stroke="#d9822b"/>
    <text x="890" y="195" text-anchor="middle">collect_demos.py</text>

    <!-- row 2: value -->
    <rect x="570" y="260" width="190" height="70" rx="8" fill="#eaf7ee" stroke="#2f9e57"/>
    <text x="665" y="288" text-anchor="middle" font-weight="700">train_value.py</text>
    <text x="665" y="310" text-anchor="middle">value_model + value_math</text>

    <rect x="310" y="260" width="190" height="70" rx="8" fill="#f6f7f9" stroke="#9aa5b4"/>
    <text x="405" y="288" text-anchor="middle" font-weight="700">checkpoints/</text>
    <text x="405" y="310" text-anchor="middle">value_round_xxx</text>

    <rect x="50" y="260" width="190" height="70" rx="8" fill="#eaf7ee" stroke="#2f9e57"/>
    <text x="145" y="288" text-anchor="middle" font-weight="700">label_advantages.py</text>
    <text x="145" y="310" text-anchor="middle">V̂ → A → acp_indicator</text>

    <!-- row 3: policy -->
    <rect x="50" y="380" width="190" height="60" rx="8" fill="#f6f7f9" stroke="#9aa5b4"/>
    <text x="145" y="415" text-anchor="middle">data/labeled/round_xxx</text>

    <rect x="290" y="380" width="200" height="60" rx="8" fill="#f3edfb" stroke="#7d55c7"/>
    <text x="390" y="405" text-anchor="middle" font-weight="700">export_dataset.py</text>
    <text x="390" y="425" text-anchor="middle">compute_norm_stats.py</text>

    <rect x="540" y="380" width="200" height="60" rx="8" fill="#f3edfb" stroke="#7d55c7"/>
    <text x="640" y="405" text-anchor="middle" font-weight="700">train_policy.py</text>
    <text x="640" y="425" text-anchor="middle">pi05_adapter（acp.py）</text>

    <rect x="790" y="380" width="180" height="60" rx="8" fill="#f6f7f9" stroke="#9aa5b4"/>
    <text x="880" y="405" text-anchor="middle">checkpoints/</text>
    <text x="880" y="425" text-anchor="middle">g2_pi05_acp_xxx</text>

    <rect x="790" y="480" width="180" height="55" rx="8" fill="#fdecec" stroke="#d64545"/>
    <text x="880" y="503" text-anchor="middle" font-weight="700">evaluate.py</text>
    <text x="880" y="523" text-anchor="middle">无纠正评测 → reports/</text>
  </g>
  <g stroke="#3b4a5f" stroke-width="1.8" fill="none" marker-end="url(#a)">
