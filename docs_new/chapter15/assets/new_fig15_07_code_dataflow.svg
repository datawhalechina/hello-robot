  <text x="600" y="54" text-anchor="middle" font-size="12" fill="#5b6b82">下一轮：新 checkpoint 启动服务继续采集</text>
  <path d="M570 190 C 545 190, 545 105, 548 105" stroke="#9aa5b4" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
