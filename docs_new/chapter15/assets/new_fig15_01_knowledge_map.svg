  <g stroke="#9aa5b4" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M115 170 V330"/><path d="M310 170 V235"/><path d="M310 279 V330"/><path d="M505 279 V330"/><path d="M700 279 V330"/><path d="M895 279 V330"/>
