    <text x="895" y="404" text-anchor="middle">export_dataset.py</text>
    <text x="895" y="426" text-anchor="middle">compute_norm_stats.py</text>
    <text x="895" y="448" text-anchor="middle">pi05_adapter.py</text>
    <text x="895" y="470" text-anchor="middle">train_policy.py</text>
    <text x="895" y="492" text-anchor="middle">serve_policy.py</text>
    <text x="895" y="514" text-anchor="middle">evaluate.py</text>
