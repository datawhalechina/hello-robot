    <text x="700" y="136" text-anchor="middle">Value target</text>
    <text x="700" y="156" text-anchor="middle">201-bin 分布式 Value</text>

    <rect x="810" y="80" width="170" height="90" rx="10" fill="#f3edfb" stroke="#7d55c7" stroke-width="2"/>
    <text x="895" y="112" text-anchor="middle" font-weight="700">第五部分</text>
    <text x="895" y="136" text-anchor="middle">50 步 Advantage</text>
