    <text x="700" y="404" text-anchor="middle">train_value.py</text>
    <text x="700" y="426" text-anchor="middle">label_advantages.py</text>

    <rect x="810" y="330" width="170" height="200" rx="10" fill="#ffffff" stroke="#7d55c7" stroke-width="1.5"/>
