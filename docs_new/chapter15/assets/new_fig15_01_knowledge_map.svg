  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">第十五章知识地图：原理（上行）与代码模块（下行）</text>

  <!-- concept row -->
  <g font-size="15" fill="#1f2d3d">
