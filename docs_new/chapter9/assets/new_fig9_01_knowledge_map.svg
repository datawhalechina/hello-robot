<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6B7C"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/>
    </marker>
  </defs>
  <rect width="1300" height="660" fill="#FFFFFF"/>
  <text x="650" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2D3D">第九章知识地图：原理部分与代码模块的对应</text>

  <!-- loop back arrow -->
  <path d="M 915 92 C 915 60, 405 60, 405 92" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="660" y="70" text-anchor="middle" font-size="14" fill="#C0392B">抓放一件后回位，重新观察（逐轮闭环）</text>

  <!-- chain boxes -->
  <g font-size="15">
    <rect x="40" y="95" width="220" height="110" rx="12" fill="#EAF2FB" stroke="#2E6DB4" stroke-width="2"/>
    <text x="150" y="125" text-anchor="middle" font-weight="700" fill="#2E6DB4">第一部分</text>
    <text x="150" y="150" text-anchor="middle" fill="#1F2D3D">完整任务链</text>
    <text x="150" y="175" text-anchor="middle" fill="#5B6B7C" font-size="13">环节输入输出 / 系统架构</text>
    <text x="150" y="195" text-anchor="middle" fill="#5B6B7C" font-size="13">场景与物体边界</text>

    <rect x="295" y="95" width="220" height="110" rx="12" fill="#EAF2FB" stroke="#2E6DB4" stroke-width="2"/>
    <text x="405" y="125" text-anchor="middle" font-weight="700" fill="#2E6DB4">第二部分</text>
    <text x="405" y="150" text-anchor="middle" fill="#1F2D3D">二维识别 → 三维测量</text>
    <text x="405" y="175" text-anchor="middle" fill="#5B6B7C" font-size="13">YOLO / SAM2 / 反投影</text>
    <text x="405" y="195" text-anchor="middle" fill="#5B6B7C" font-size="13">坐标变换 / 桌面 RANSAC</text>

    <rect x="550" y="95" width="220" height="110" rx="12" fill="#EAF2FB" stroke="#2E6DB4" stroke-width="2"/>
    <text x="660" y="125" text-anchor="middle" font-weight="700" fill="#2E6DB4">第三部分</text>
    <text x="660" y="150" text-anchor="middle" fill="#1F2D3D">物体几何 → 夹爪目标</text>
    <text x="660" y="175" text-anchor="middle" fill="#5B6B7C" font-size="13">2.5D 姿态 / 几何后端</text>
    <text x="660" y="195" text-anchor="middle" fill="#5B6B7C" font-size="13">GraspGenX / 统一筛选</text>

    <rect x="805" y="95" width="220" height="110" rx="12" fill="#EAF2FB" stroke="#2E6DB4" stroke-width="2"/>
    <text x="915" y="125" text-anchor="middle" font-weight="700" fill="#2E6DB4">第四部分</text>
    <text x="915" y="150" text-anchor="middle" fill="#1F2D3D">目标位姿 → 运动控制</text>
    <text x="915" y="175" text-anchor="middle" fill="#5B6B7C" font-size="13">完整位姿 IK / 分段路径</text>
    <text x="915" y="195" text-anchor="middle" fill="#5B6B7C" font-size="13">碰撞近似 / 执行与验收</text>

    <rect x="1060" y="95" width="220" height="110" rx="12" fill="#EAF2FB" stroke="#2E6DB4" stroke-width="2"/>
    <text x="1170" y="125" text-anchor="middle" font-weight="700" fill="#2E6DB4">第五部分</text>
    <text x="1170" y="150" text-anchor="middle" fill="#1F2D3D">数据、训练与评估</text>
    <text x="1170" y="175" text-anchor="middle" fill="#5B6B7C" font-size="13">检测标签 / 指标含义</text>
    <text x="1170" y="195" text-anchor="middle" fill="#5B6B7C" font-size="13">四宫格观察窗口</text>
  </g>
  <line x1="260" y1="150" x2="293" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>
  <line x1="515" y1="150" x2="548" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>
  <line x1="770" y1="150" x2="803" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1025" y1="150" x2="1058" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>

  <!-- vertical mapping -->
  <g stroke="#9AA8B6" stroke-width="1.5" stroke-dasharray="5 4">
