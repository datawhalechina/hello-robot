    <text x="58" y="312">config.py</text>
    <text x="58" y="339">scene.py</text>
    <text x="58" y="366">simulation.py</text>
    <text x="58" y="393">worker_client.py</text>

    <rect x="295" y="255" width="220" height="175" rx="10" fill="#F6F8FA" stroke="#9AA8B6"/>
    <text x="313" y="285">camera.py</text>
    <text x="313" y="312">perception.py</text>
    <text x="313" y="339">pointcloud.py</text>
    <text x="313" y="366">  unproject / fit_table</text>
    <text x="313" y="393">worker.py（VisionPipeline）</text>

    <rect x="550" y="255" width="220" height="175" rx="10" fill="#F6F8FA" stroke="#9AA8B6"/>
    <text x="568" y="285">pointcloud.estimate_pose</text>
    <text x="568" y="312">grasp_planner.py</text>
    <text x="568" y="339">  geometric_grasps</text>
    <text x="568" y="366">  filter_grasps</text>
    <text x="568" y="393">graspgenx_backend.py</text>

    <rect x="805" y="255" width="220" height="175" rx="10" fill="#F6F8FA" stroke="#9AA8B6"/>
    <text x="823" y="285">kinematics.py（FK/IK）</text>
    <text x="823" y="312">controller.py</text>
    <text x="823" y="339">  plan / move / execute</text>
    <text x="823" y="366">arm_controller.py</text>
    <text x="823" y="393">scene.evaluate_lift / placed</text>

    <rect x="1060" y="255" width="220" height="175" rx="10" fill="#F6F8FA" stroke="#9AA8B6"/>
    <text x="1078" y="285">collect_dataset.py</text>
    <text x="1078" y="312">train_detector.py</text>
    <text x="1078" y="339">download_weights.py</text>
    <text x="1078" y="366">viewer.py</text>
    <text x="1078" y="393">replay.py / replay_plan.py</text>
  </g>

  <!-- bottom bands -->
  <rect x="40" y="470" width="1240" height="70" rx="12" fill="#FDF3E7" stroke="#D68910" stroke-width="2"/>
  <text x="660" y="500" text-anchor="middle" font-size="16" font-weight="700" fill="#B9770E">第六部分 代码结构与实现解析</text>
  <text x="660" y="525" text-anchor="middle" font-size="14" fill="#1F2D3D">文件组织 → 进程与模块调用关系 → 按 demo_grasp.py 主循环逐段解读一轮抓放</text>

  <rect x="40" y="565" width="1240" height="70" rx="12" fill="#EAF7EF" stroke="#239B56" stroke-width="2"/>
  <text x="660" y="595" text-anchor="middle" font-size="16" font-weight="700" fill="#1E8449">第七部分 代码运行</text>
  <text x="660" y="620" text-anchor="middle" font-size="14" fill="#1F2D3D">源码与环境 → 权重 → 采集数据 → 训练 YOLO → 感知实验 → 单/多物体抓放 → 读报告与离线复查</text>
</svg>
