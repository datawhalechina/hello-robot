<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <title>第五章知识地图</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>
  <rect width="1100" height="600" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">第五章知识地图：从“末端要去哪”到“关节怎么转”</text>

  <!-- column headers -->
  <text x="160" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">基础（第一、二部分）</text>
  <text x="450" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">运动学（第三、四部分）</text>
  <text x="745" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">控制（第五、六部分）</text>
  <text x="985" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">对应代码</text>

  <g font-size="15" fill="#0f172a" text-anchor="middle">
    <rect x="40" y="95" width="240" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="124" font-weight="700">关节空间 q / 任务空间 T</text>
    <text x="160" y="148" font-size="13">位置、姿态、齐次变换、弧度</text>

    <rect x="40" y="190" width="240" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="219" font-weight="700">坐标系 arm_base_link</text>
    <text x="160" y="243" font-size="13">所有 FK/IK 目标的统一参考系</text>

    <rect x="40" y="285" width="240" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="314" font-weight="700">G2 双 7 自由度机械臂</text>
    <text x="160" y="338" font-size="13">关节名、限位、HOME、镜像符号</text>

    <rect x="330" y="95" width="240" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="124" font-weight="700">正运动学 FK</text>
    <text x="450" y="148" font-size="13">逐段齐次变换相乘（DH / URDF）</text>

    <rect x="330" y="190" width="240" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="219" font-weight="700">几何 Jacobian J(q)</text>
    <text x="450" y="243" font-size="13">Jv,i = zi × (pee − pi)，Jω,i = zi</text>

    <rect x="330" y="285" width="240" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="314" font-weight="700">DLS 数值 IK</text>
    <text x="450" y="338" font-size="13">阻尼伪逆 + 零空间居中 + 限位</text>

    <rect x="330" y="380" width="240" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="409" font-weight="700">工程版：Lula IK</text>
    <text x="450" y="433" font-size="13">三层 fallback（补充文档）</text>

    <rect x="625" y="95" width="240" height="70" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="745" y="124" font-weight="700">三次时间缩放轨迹</text>
    <text x="745" y="148" font-size="13">s(τ) = 3τ² − 2τ³</text>

    <rect x="625" y="190" width="240" height="70" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="745" y="219" font-weight="700">关节 PD 闭环</text>
    <text x="745" y="243" font-size="13">PhysX drive / 速度式 PD</text>

    <rect x="625" y="285" width="240" height="70" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="745" y="314" font-weight="700">双臂同步</text>
    <text x="745" y="338" font-size="13">14 个关节一个 action 发送</text>

    <rect x="625" y="380" width="240" height="70" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="745" y="409" font-weight="700">抓取任务拆解</text>
    <text x="745" y="433" font-size="13">预抓取 → 下降 → 闭合 → 抬升</text>
  </g>

  <g font-size="13" fill="#0f172a">
    <rect x="900" y="95" width="170" height="355" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="915" y="125">config.py</text>
    <text x="915" y="145" fill="#64748b">关节名 / 限位 / IK 参数</text>
    <text x="915" y="180">kinematics.py</text>
    <text x="915" y="200" fill="#64748b">FK / Jacobian / DLS-IK</text>
    <text x="915" y="235">arm_controller.py</text>
    <text x="915" y="255" fill="#64748b">轨迹 / 单双臂控制</text>
    <text x="915" y="290">simulation.py</text>
    <text x="915" y="310" fill="#64748b">Isaac Sim 场景 / 位姿读取</text>
    <text x="915" y="345">demo_joint_control.py</text>
    <text x="915" y="370">demo_fk_ik.py</text>
    <text x="915" y="395">demo_target_position.py</text>
    <text x="915" y="420" fill="#64748b">三个可运行实验</text>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="280" y1="130" x2="322" y2="130"/>
    <line x1="450" y1="165" x2="450" y2="182"/>
    <line x1="450" y1="260" x2="450" y2="277"/>
    <line x1="570" y1="320" x2="617" y2="138"/>
    <line x1="745" y1="165" x2="745" y2="182"/>
    <line x1="745" y1="260" x2="745" y2="277"/>
    <line x1="745" y1="355" x2="745" y2="372"/>
    <line x1="280" y1="320" x2="322" y2="320"/>
    <line x1="280" y1="225" x2="322" y2="225"/>
  </g>
  <path d="M745 450 L745 520 L450 520 L450 458" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="600" y="545" text-anchor="middle" font-size="13" fill="#475569">执行后读取实际关节角，用 FK 与 USD 位姿核对末端误差（闭环验证）</text>
  <text x="550" y="585" text-anchor="middle" font-size="13" fill="#64748b">蓝：概念基础　绿：运动学算法　橙：轨迹与控制　灰：代码模块</text>
</svg>
