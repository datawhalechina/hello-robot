<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7fbf"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">前视点跟踪手算：机器人偏离直线路径 0.2 m</text>

  <!-- scale: 300 px per m, origin x=100, y=260 (path y=0) -->
  <line x1="100" y1="260" x2="640" y2="260" stroke="#4c9a5f" stroke-width="3"/>
  <text x="645" y="264" font-size="12" fill="#1f4d2b">参考路径 y = 0（每 0.1 m 一个点）</text>
  <g fill="#4c9a5f">
    <circle cx="100" cy="260" r="3"/><circle cx="130" cy="260" r="3"/><circle cx="160" cy="260" r="3"/>
    <circle cx="190" cy="260" r="3"/><circle cx="220" cy="260" r="3"/><circle cx="250" cy="260" r="3"/>
    <circle cx="280" cy="260" r="3"/><circle cx="310" cy="260" r="3"/><circle cx="340" cy="260" r="3"/>
    <circle cx="370" cy="260" r="3"/><circle cx="400" cy="260" r="3"/><circle cx="430" cy="260" r="3"/>
  </g>
  <!-- robot at (0,0.2) -->
  <rect x="82" y="182" width="36" height="36" rx="5" fill="#e8f1fb" stroke="#4a7fbf" stroke-width="2"/>
  <line x1="100" y1="200" x2="140" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>
  <text x="70" y="172" font-size="12" fill="#1f3b5c">机器人 (0, 0.2, ψ=0)</text>
  <!-- nearest point -->
  <text x="88" y="285" font-size="11" fill="#555">最近点 (0,0)</text>
  <!-- lookahead target -->
  <circle cx="310" cy="260" r="7" fill="none" stroke="#c0504d" stroke-width="2.5"/>
  <text x="286" y="290" font-size="12" fill="#7a1f1d">前视点 (0.7, 0)</text>
  <text x="200" y="305" font-size="11" fill="#7a1f1d">沿路径累计 0.7 m ≥ lookahead 0.70</text>
  <!-- error vector -->
  <line x1="100" y1="200" x2="304" y2="258" stroke="#c0504d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a1)"/>
  <text x="170" y="214" font-size="12" fill="#7a1f1d">误差 (0.7, −0.2)</text>
  <!-- command vector scaled -->
  <line x1="100" y1="200" x2="238" y2="240" stroke="#4a7fbf" stroke-width="3" marker-end="url(#a2)"/>
  <text x="150" y="250" font-size="12" fill="#1f3b5c">指令 (0.462, −0.132)</text>

  <!-- calc panel -->
  <rect x="560" y="60" width="320" height="170" rx="8" fill="#f6f8fb" stroke="#c9d3e0"/>
  <text x="575" y="84" font-size="13" fill="#333">① ψ=0，体坐标误差 = 世界误差</text>
  <text x="575" y="106" font-size="13" fill="#333">② kp=1.0 → (vx,vy) = (0.70, −0.20)</text>
  <text x="575" y="128" font-size="13" fill="#333">③ |v| = 0.728 &gt; 上限 0.48</text>
  <text x="575" y="150" font-size="13" fill="#333">④ 缩放 0.48/0.728 = 0.659</text>
  <text x="575" y="172" font-size="13" fill="#333">⑤ (vx,vy) = (0.462, −0.132) m/s</text>
  <text x="575" y="194" font-size="13" fill="#333">⑥ 目标切线 ψ=0 → ωz = 0</text>
  <text x="575" y="216" font-size="12" fill="#666">方向不变，仅大小被限到 0.48 m/s</text>

  <text x="100" y="350" font-size="13" fill="#333">要点：全向底盘同时输出 vx 和 vy，不必先转向再前进；合速度统一缩放保持了“指向前视点”的方向。</text>
  <text x="100" y="372" font-size="13" fill="#333">若处于绕行状态，导航器再把合速度限到 detour_speed_limit = 0.34 m/s。</text>
</svg>
