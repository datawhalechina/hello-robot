<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="920" height="400" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Chaikin 平滑与等距重采样手算</text>

  <!-- left: chaikin, scale 240 px per m, origin (80, 330) -->
  <text x="230" y="60" text-anchor="middle" font-size="14" fill="#333">Chaikin：A(0,0) → B(1,0) → C(1,1)</text>
  <polyline points="80,330 320,330 320,90" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="6 4"/>
  <polyline points="80,330 140,330 260,330 320,270 320,150 320,90" fill="none" stroke="#4a7fbf" stroke-width="2.5"/>
  <polyline points="80,330 95,330 125,330 170,330 230,330 275,315 305,285 320,240 320,180 320,135 320,105 320,90" fill="none" stroke="#c0504d" stroke-width="2"/>
  <circle cx="80" cy="330" r="5" fill="#333"/><text x="70" y="352" font-size="12" fill="#333">A</text>
  <circle cx="320" cy="330" r="5" fill="#bbb"/><text x="328" y="352" font-size="12" fill="#888">B（被切掉）</text>
  <circle cx="320" cy="90" r="5" fill="#333"/><text x="330" y="94" font-size="12" fill="#333">C</text>
  <circle cx="140" cy="330" r="4" fill="#4a7fbf"/><text x="122" y="318" font-size="11" fill="#1f3b5c">Q₀(0.25,0)</text>
  <circle cx="260" cy="330" r="4" fill="#4a7fbf"/><text x="220" y="318" font-size="11" fill="#1f3b5c">R₀(0.75,0)</text>
  <circle cx="320" cy="270" r="4" fill="#4a7fbf"/><text x="330" y="274" font-size="11" fill="#1f3b5c">Q₁(1,0.25)</text>
  <circle cx="320" cy="150" r="4" fill="#4a7fbf"/><text x="330" y="154" font-size="11" fill="#1f3b5c">R₁(1,0.75)</text>
  <line x1="80" y1="378" x2="104" y2="378" stroke="#bbb" stroke-width="2" stroke-dasharray="6 4"/><text x="110" y="382" font-size="12" fill="#333">原折线</text>
  <line x1="170" y1="378" x2="194" y2="378" stroke="#4a7fbf" stroke-width="2.5"/><text x="200" y="382" font-size="12" fill="#333">迭代 1 次（6 点）</text>
  <line x1="320" y1="378" x2="344" y2="378" stroke="#c0504d" stroke-width="2"/><text x="350" y="382" font-size="12" fill="#333">迭代 2 次（12 点）</text>

  <!-- right: resample, scale 800 px per m, origin (520, 330) -->
  <text x="700" y="60" text-anchor="middle" font-size="14" fill="#333">重采样 spacing = 0.12 m</text>
  <text x="700" y="80" text-anchor="middle" font-size="12" fill="#666">输入：(0,0) → (0.30,0) → (0.30,0.20)，总长 0.50 m</text>
  <polyline points="520,330 760,330 760,170" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="520" cy="330" r="5" fill="#333"/><text x="500" y="352" font-size="11" fill="#333">P0 (0,0)</text>
  <circle cx="616" cy="330" r="5" fill="#d08a2e"/><text x="596" y="352" font-size="11" fill="#6b4210">P1 (0.12,0)</text>
  <circle cx="712" cy="330" r="5" fill="#d08a2e"/><text x="682" y="352" font-size="11" fill="#6b4210">P2 (0.24,0)</text>
  <circle cx="760" cy="282" r="5" fill="#d08a2e"/><text x="770" y="286" font-size="11" fill="#6b4210">P3 (0.30,0.06)</text>
  <circle cx="760" cy="186" r="5" fill="#d08a2e"/><text x="770" y="190" font-size="11" fill="#6b4210">P4 (0.30,0.18)</text>
  <circle cx="760" cy="170" r="5" fill="#333"/><text x="770" y="166" font-size="11" fill="#333">P5 (0.30,0.20) 终点</text>
  <text x="560" y="230" font-size="12" fill="#333">P2→拐角剩 0.06 m，</text>
  <text x="560" y="248" font-size="12" fill="#333">再沿竖边走 0.06 m 得 P3</text>
  <text x="560" y="372" font-size="12" fill="#333">航向：0, 0, 0.785(45°), 1.571, 1.571, 终点用 ψg</text>
</svg>
